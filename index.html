<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Tasks" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#14110e" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <link rel="manifest" href="manifest.json" />
  <title>Tasks</title>
  <style>
    :root {
      --bg: #14110e;
      --card: #1e1a16;
      --ink: #f3ece3;
      --muted: #b7a99a;
      --line: #3a322b;
      --go: #e8a14a;
      --ok: #8fbe8b;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body {
      min-height: 100dvh;
      overflow-x: hidden;
    }
    .wrap {
      container-type: inline-size;
      container-name: pane;
      width: 100%;
      max-width: 100%;
      padding: calc(16px + env(safe-area-inset-top)) 14px calc(28px + env(safe-area-inset-bottom));
    }
    header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }
    .brand .eyebrow {
      color: var(--go);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-size: 11px;
      font-weight: 600;
    }
    h1 {
      font-size: clamp(28px, 7.2cqw, 44px);
      line-height: 0.95;
      margin: 6px 0 0;
      font-weight: 650;
    }
    .live-badge {
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--go);
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 600;
      padding-bottom: 4px;
      flex: 0 0 auto;
    }
    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--go);
      animation: pulse 1.8s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(232,161,74,0.55); }
      70% { box-shadow: 0 0 0 8px rgba(232,161,74,0); }
      100% { box-shadow: 0 0 0 0 rgba(232,161,74,0); }
    }
    .when { color: var(--muted); font-size: 13px; margin: 0 0 16px; }
    .stack { display: flex; flex-direction: column; gap: 16px; }
    section { min-width: 0; }
    h2 {
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 8px;
      font-weight: 600;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px 13px;
      margin: 0 0 8px;
      min-width: 0;
    }
    .card h3 {
      margin: 0 0 4px;
      font-size: clamp(16px, 4.2cqw, 18px);
      font-weight: 600;
      overflow-wrap: anywhere;
    }
    .card p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }
    .tag {
      display: inline-block;
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 2px 7px;
      border-radius: 999px;
      margin-bottom: 6px;
    }
    .tag.live { background: #3a2a14; color: var(--go); }
    .tag.you { background: #3a241c; color: #f0b089; }
    .tag.quiet { background: #1f2a1e; color: var(--ok); }
    footer { margin-top: 18px; color: var(--muted); font-size: 12px; }

    @container pane (min-width: 720px) {
      .wrap { padding-left: 22px; padding-right: 22px; }
      .stack { display: grid; grid-template-columns: 1.15fr 0.85fr; gap: 18px; align-items: start; }
      .primary { display: contents; }
      h1 { font-size: 48px; }
      .card { padding: 16px; border-radius: 18px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <div class="eyebrow">Companion</div>
        <h1>Tasks</h1>
      </div>
      <div class="live-badge"><span class="dot"></span> Live</div>
    </header>
    <div class="when" id="when">Loading…</div>
    <div class="stack">
      <div class="primary">
        <section>
          <h2>Live</h2>
          <div id="live"></div>
        </section>
        <section>
          <h2>Waiting on you</h2>
          <div id="waiting"></div>
        </section>
      </div>
      <section>
        <h2>Quiet</h2>
        <div id="quiet"></div>
      </section>
    </div>
    <footer>Split-view first. Drag the divider. Chat stays in Grok Bot.</footer>
  </div>
  <script>
    function esc(s) {
      return String(s || '').replace(/[&<>"']/g, c => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
      }[c]));
    }
    function cards(list, cls) {
      if (!list || !list.length) return '<article class="card"><p>Nothing here.</p></article>';
      return list.map(item => `
        <article class="card">
          <span class="tag ${cls}">${esc(item.tag)}</span>
          <h3>${esc(item.title)}</h3>
          <p>${esc(item.body)}</p>
        </article>`).join('');
    }
    async function refresh() {
      try {
        const res = await fetch('status.json?t=' + Date.now(), { cache: 'no-store' });
        const data = await res.json();
        document.getElementById('when').textContent = 'Updated ' + (data.updated || '');
        document.getElementById('live').innerHTML = cards(data.live, 'live');
        document.getElementById('waiting').innerHTML = cards(data.waiting, 'you');
        document.getElementById('quiet').innerHTML = cards(data.quiet, 'quiet');
      } catch (err) {
        document.getElementById('when').textContent = 'Could not refresh. I’ll keep trying.';
      }
    }
    refresh();
    setInterval(refresh, 20000);
  </script>
</body>
</html>
